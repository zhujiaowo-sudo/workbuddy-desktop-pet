[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-desktop-pet"
version = "0.6.2"
description = "A local Windows desktop companion for WorkBuddy"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
workbuddy-pet = "workbuddy_pet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy_pet = ["catalog.json", "assets/*.png", "update_install.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
